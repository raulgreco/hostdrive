name: Release

# Dispara ao empurrar uma tag "vX.Y.Z" (ex.: v0.2.0), ou manualmente pela
# aba Actions. Builda macOS, Windows e Linux em runners reais do GitHub —
# nada de cross-compilação aqui, diferente do fluxo de desenvolvimento local
# (docs/decisions/002-windows-cross-compilation.md), que só existe porque
# este Mac não tinha outra forma de validar o build Windows antes de ter CI.
# O disparo manual (workflow_dispatch) roda SÓ o job linux-build: gera .deb
# e .AppImage como artefatos do workflow, sem criar release/tag nenhuma.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-latest
            args: "--bundles deb,appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependências do npm
        run: npm ci

      - name: Build + assinatura + publicação no Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Eureka42 ${{ github.ref_name }}"
          releaseBody: "Ver detalhes em docs/implementation-status.md e docs/decisions/."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Build Linux sob demanda (disparo manual): sem tag, sem release — só os
  # pacotes .deb e .AppImage anexados ao run para teste/validação.
  linux-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependências do npm
        run: npm ci

      - name: Build Linux (.deb + AppImage)
        run: npm run tauri -- build --bundles deb,appimage

      - name: Enviar pacotes como artefatos do workflow
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
