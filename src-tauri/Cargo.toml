[package]
name = "universal-ai-cli"
version = "0.1.0"
description = "Local-first desktop orchestrator for AI coding CLIs"
authors = ["HostDrive contributors"]
edition = "2021"

[lib]
name = "universal_ai_cli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
# Sincronização opcional via Nextcloud (WebDAV) — ver docs/decisions/005-nextcloud-sync.md
# reqwest (não ureq: ureq-proto recusa métodos WebDAV como MKCOL/PROPFIND
# por não estarem na lista fixa de métodos "padrão" HTTP/1.1 que valida —
# ver docs/decisions/005-nextcloud-sync.md, nota da correção). TLS já vem
# resolvido via tauri-plugin-updater (rustls+ring); não repetimos feature
# de TLS aqui para não divergir da combinação já unificada pelo Cargo.
reqwest = { version = "0.13", default-features = false }
keyring = "4"
aes-gcm = "0.10"
argon2 = "0.5"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

[dev-dependencies]
tempfile = "3.27"
